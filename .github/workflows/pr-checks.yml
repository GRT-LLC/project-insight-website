# PR quality gate — runs on every pull request so non-compliant copy is
# caught at review time, not at deploy (PR #21 review, M1). The deploy
# workflow (node.js.yml) re-runs the guard on push to main as the final gate.
name: PR checks

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 23.x
          cache: 'npm'
      - name: Install dependencies
        run: npm i
      - name: Plan-not-book language guard
        run: npm run lint:plan-not-book
      - name: Social meta guard
        run: npm run lint:social-meta
      - name: Brand mark is in sync with brand/logo/
        run: npm run logo:check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
