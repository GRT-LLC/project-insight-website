# PR quality gate — runs on every branch push so non-compliant copy is
# caught at review time, not at deploy (PR #21 review, M1). The deploy
# workflow (node.js.yml) re-runs the guard on push to main as the final gate.
name: PR checks

on:
  push:
    # JAR-749: push-triggered only (all branches — branch pushes produce the
    # required check on the PR's head commit, so same-repo PRs keep full
    # coverage). NO pull_request: this repo is PUBLIC — any stranger can
    # fork it, and pull_request events execute the fork's edited workflow
    # file from the merge ref, handing them arbitrary code execution on the
    # credential-bearing self-hosted runner. NO paths-ignore: docs-only PRs
    # would get no required check and deadlock at merge (JAR-643);
    # self-hosted runs cost zero Actions minutes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: spare  # JAR-749: self-hosted runner (billing-limited hosted CI)
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: 'npm'
      - name: Install dependencies
        run: npm i
      - name: Plan-not-book language guard
        run: npm run lint:plan-not-book
      - name: Social meta guard
        run: npm run lint:social-meta
      - name: OG card is the real lockup
        # JAR-628 said marketing#32 "must be closed, not merged" because it
        # installed a card drawing a placeholder "JT" tile. It was merged, and
        # main shipped that placeholder on every link preview. A checksum is
        # blunt, but the card is a binary this repo does not generate — there is
        # nothing subtler to assert, and blunt would have caught it.
        run: npm run lint:og-card

      - name: Brand mark is in sync, and the generator refuses hostile sources
        # Two things: the committed Logo.tsx and favicon.svg must still match
        # brand/logo/, and the generator's allowlist must still refuse a source
        # SVG carrying <script>, on*, <image>, <use> or a JSX brace — it is the
        # only gate between a mark and every visitor's DOM.
        run: |
          npm run logo:check
          npm run test:scripts
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
